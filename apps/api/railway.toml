[build]
builder    = "NIXPACKS"
buildCommand = "npm install --legacy-peer-deps && npm run build"

[deploy]
startCommand  = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "mychat-api"

[services.variables]
NODE_ENV = "production"
PORT     = "3001"
