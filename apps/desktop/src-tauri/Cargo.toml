[package]
name    = "mychat"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "system-tray",
  "updater",
  "notification-all",
  "os-all",
  "shell-open",
  "window-close",
  "window-hide",
  "window-show",
  "window-maximize",
  "window-minimize",
  "window-unmaximize",
  "window-unminimize",
  "window-start-dragging",
] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[profile.release]
panic       = "abort"
codegen-units = 1
lto         = true
opt-level   = "s"
strip       = true
